# postq 기동 — 단일 호스트/로컬용.
#
#   docker compose up --build
#   → postq  : http://localhost:3000  (SQLite 는 postq_postq-data 볼륨에 영속)
#
# 프로젝트 이름을 고정한다 — 안 적으면 폴더 이름을 쓰므로, 저장소를 받은 폴더 이름에 따라 볼륨 이름이 바뀐다.
name: postq
services:
  postq:
    build: .
    image: postq:latest
    # 로그인이 없는 앱이다 — 호스트의 127.0.0.1 에만 연다. "3000:3000" 으로 바꾸면 같은 망의 누구나
    # 모든 요청·환경 비밀값을 쓰고, 서버를 거쳐 내부망 주소로 요청을 보낼 수 있다. 바깥에 열려면 docs/auth.md.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # compose 내부 DNS — 브라우저가 아니라 postq 서버가 호출하므로 서비스명으로 충분
      # 서버(postq-server)는 $POSTQ_HOST 에 바인딩한다(기본 127.0.0.1). 컨테이너 안에서는 0.0.0.0 이어야
      # 포트 매핑이 닿는다. 컨테이너 안의 0.0.0.0 이고, 호스트에서 어디까지 닿는지는 위 ports 가 정한다.
      POSTQ_HOST: "0.0.0.0"
    volumes:
      - postq-data:/data
    restart: unless-stopped
    healthcheck:
      # 이미지에 Node 가 없다(Rust 서버) — alpine busybox 의 wget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  postq-data:
