name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check release versions
        run: npm run version:check
      - name: Check untranslated JSX
        run: node scripts/check-i18n.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Release script tests
        run: node --test scripts/npm-release.test.mjs
      - name: Build (static UI)
        run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Server tests
        working-directory: server
        run: cargo test --locked
      - name: Server release build
        working-directory: server
        run: cargo build --release --locked

  # npm 으로 깔았을 때 실제로 뜨는지 — 윈도우에서 돌려 보는 유일한 곳이다.
  install-smoke:
    needs: [web, server]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci
      - run: npm run build
      - name: Build postq
        working-directory: server
        run: cargo build --release --locked --bin postq
      - name: Package for this OS
        run: node scripts/package-release.mjs --main --out dist
      - name: npm install -g the tarballs
        run: |
          mkdir -p tgz
          (cd tgz && npm pack ../dist/npm/postq ../dist/npm/postq-*)
          ls -la tgz
          # ./ 가 없으면 npm 이 'tgz/…' 를 GitHub 저장소 줄임말로 읽는다.
          # --omit=optional: 레지스트리에 같은 버전이 있어도 그걸 받지 않고 방금 만든 tgz 를 시험한다.
          npm install -g --omit=optional ./tgz/*.tgz
      - name: postq --version
        run: postq --version
      - name: Start, check, stop
        run: |
          data="$RUNNER_TEMP/pq-data"
          postq --no-open --port 39250 --data-dir "$data" > "$RUNNER_TEMP/pq.log" 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:39250/api/health; then ok=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pq.log"
          test -n "$ok"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:39250/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:39250/)" = 200
          test -f "$data/postq.db"
          test -s "$data/secret.key"
          if [ "$RUNNER_OS" = Windows ]; then
            # 여기서는 정리만 한다 — 윈도우의 Ctrl+C·Ctrl+Break 종료는 아래 단계가 실제 콘솔 이벤트로 확인한다.
            taskkill //F //IM postq.exe
          else
            # 터미널 Ctrl+C 처럼 서버(postq)에 SIGINT — 런처(node)는 자식의 종료 코드 0 을 그대로 돌려줘야 한다.
            pkill -INT -x postq
            code=0; wait "$pid" || code=$?
            echo "launcher exit code $code"
            test "$code" = 0
          fi
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:39250/api/health || { echo "stopped"; exit 0; }
            sleep 0.5
          done
          echo "still listening on 39250"; exit 1
      - name: Windows — stop with Ctrl+C, then Ctrl+Break (exit code 0)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Join-Path (npm root -g) '@rocknzero\postq\bin\postq.js'
          ./scripts/win-ctrl-smoke.ps1 -Launcher $launcher -Port 39251 -DataDir "$env:RUNNER_TEMP\pq-ctrl-c" -Event CtrlC
          ./scripts/win-ctrl-smoke.ps1 -Launcher $launcher -Port 39252 -DataDir "$env:RUNNER_TEMP\pq-ctrl-break" -Event CtrlBreak
