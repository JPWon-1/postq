name: Release

# v* 태그를 푸시하면: 화면을 한 번 빌드 → 5개 대상 실행 파일 빌드·묶음 → GitHub Release 업로드(이미 있으면 자산만 교체)
# → npm 배포(NPM_TOKEN 이 있으면 토큰, 없으면 Trusted Publishing/OIDC. 저장소 변수 NPM_PUBLISH=false 면 건너뜀)
# → (HOMEBREW_TAP_TOKEN 이 있으면) Homebrew 탭 갱신. 절차는 docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 버전과 상관없이 한 번에 하나만 — 두 태그가 겹쳐 돌면 늦게 끝난 옛 버전이 npm latest·탭을 되돌릴 수 있다.
# (그래도 순서가 꼬일 때를 대비해 npm·탭 단계가 '현재보다 낮은 버전' 을 따로 막는다.)
# GitHub 는 같은 그룹에 대기 중인 실행을 하나만 둔다 — 세 번째가 들어오면 대기 중이던 것이 취소되니 그 태그는 다시 돌린다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Tag matches version
        run: |
          node scripts/check-version.mjs
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: out/
          if-no-files-found: error

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # glibc 2.35 — 너무 새 우분투에서 빌드하면 오래된 배포판에서 실행되지 않는다.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: out
      - name: Build
        working-directory: server
        run: cargo build --release --locked --bin postq --target ${{ matrix.target }}
      - name: Package
        run: node scripts/package-release.mjs --target ${{ matrix.target }} --out dist
      - name: Smoke (--version)
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: |
          exe=server/target/${{ matrix.target }}/release/postq
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
      # upload-artifact 는 파일 권한을 담지 않는다 — dist/npm 을 그대로 올리면 실행 파일이 0644 로 돌아와
      # 설치 뒤 spawn EACCES 가 난다. tar 로 묶어 실행 비트째 넘긴다.
      - name: Bundle npm package dir (keeps the exec bit)
        run: tar -cf "dist/npm-${{ matrix.target }}.tar" -C dist npm
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/npm-*.tar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release (or replace its assets on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          files=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — uploading assets with --clobber"
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
            # 앞 실행이 자산을 올리다 멈추면 draft 로 남는다 — 그대로 두면 사용자가 자산을 못 받는다.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" = "true" ]; then
              echo "release $GITHUB_REF_NAME is still a draft — publishing it"
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            v="${GITHUB_REF_NAME#v}"
            flags=()
            case "$v" in *-*) flags+=(--prerelease --latest=false) ;; esac
            # 뒤늦게 돈 옛 태그가 'Latest' 를 되돌리지 않게.
            cur=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$cur" ] && [ "$(node scripts/npm-release.mjs compare "$v" "$cur")" = "-1" ]; then flags+=(--latest=false); fi
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" "${files[@]}"
          fi

  npm:
    needs: release
    # 저장소 변수(Settings → Variables) NPM_PUBLISH 를 false 로 두면 npm 배포를 건너뛴다.
    if: vars.NPM_PUBLISH != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing(OIDC)과 --provenance 에 필요
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      # Trusted Publishing 은 npm 11.5.1 이상에서 된다(node 22 에 딸린 npm 은 10.x).
      - run: npm install -g 'npm@^11.5.1' && npm --version
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Unpack npm package dirs, add the main package
        run: |
          for t in dist/npm-*.tar; do tar -xf "$t" -C dist; done
          node scripts/package-release.mjs --main-only --out dist
          ls -la dist/npm/*
      # 실행 비트를 한 번 더 되살리고, 만든 tgz 안의 실행 파일 모드를 검사한다.
      - name: Pack
        run: node scripts/npm-release.mjs pack --npm-dir dist/npm --out tgz
      # 같은 이름·버전이 이미 있으면 그 shasum·integrity 가 이번 tgz 와 같아야 한다(남이 선점했으면 여기서 멈춘다).
      - name: Check the registry
        run: node scripts/npm-release.mjs verify --packs tgz/packs.json
      # --omit=optional: 같은 버전이 이미 레지스트리에 있으면 npm 이 그걸 메인 패키지 밑에 중첩으로 받아
      # 런처가 그쪽을 먼저 찾는다 — 이번에 만든 tgz 를 시험하도록 막는다(런처는 형제 패키지를 찾는다).
      - name: Install the tarballs and run --version (linux x64)
        run: |
          v=$(node -p "require('./package.json').version")
          prefix="$RUNNER_TEMP/pq"
          npm install -g --prefix "$prefix" --omit=optional --no-audit --no-fund "./tgz/postq-$v.tgz" "./tgz/postq-linux-x64-$v.tgz"
          out=$("$prefix/bin/postq" --version)
          echo "$out"
          test "$out" = "postq $v"
      - name: Publish platform packages, then the main package
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            echo "auth: NPM_TOKEN secret"
          else
            echo "auth: no NPM_TOKEN — npm will use Trusted Publishing (OIDC)"
          fi
          node scripts/npm-release.mjs publish --packs tgz/packs.json

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate formula
        run: |
          node scripts/update-formula.mjs --dist dist --out postq.rb
          cat postq.rb
      - name: Push to JPWon-1/homebrew-tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in *-*) echo "prerelease $v — tap not updated"; exit 0 ;; esac
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/JPWon-1/homebrew-tap.git" tap
          mkdir -p tap/Formula
          # 탭에 이미 더 높은 버전이 있으면(옛 태그가 뒤늦게 돈 경우) 되돌리지 않는다.
          cur=$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Formula/postq.rb 2>/dev/null | head -1)
          if [ -n "$cur" ] && [ "$(node scripts/npm-release.mjs compare "$v" "$cur")" = "-1" ]; then
            echo "tap has $cur, newer than $v — not updating"; exit 0
          fi
          cp postq.rb tap/Formula/postq.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/postq.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "postq ${GITHUB_REF_NAME}"
          git push origin HEAD
      - name: Skip (no HOMEBREW_TAP_TOKEN)
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN secret is not set — copy the formula printed above into JPWon-1/homebrew-tap/Formula/postq.rb."
