<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 320px; padding: 14px 16px;
    background: #1d2027; color: #e9ecf1; word-break: keep-all;
    font: 13px/1.6 -apple-system, system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
  p.sub { margin: 0 0 12px; color: #909aa8; font-size: 11px; }
  label { display: block; margin: 10px 0 3px; color: #b0b8c4; font-size: 11px; }
  input {
    width: 100%; box-sizing: border-box; height: 30px; padding: 0 8px;
    background: #282c35; border: 1px solid #343945; border-radius: 6px;
    color: #e9ecf1; font: 12px ui-monospace, Menlo, monospace; outline: none;
  }
  input:focus { border-color: #6366f1; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button {
    width: 100%; height: 34px; margin-top: 14px;
    background: #6366f1; color: #fff; border: 0; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 12px; font-size: 12px; min-height: 18px; }
  #out.ok { color: #3fb950; }
  #out.err { color: #f85149; }
  .hint { margin-top: 10px; font-size: 10px; color: #5b6b85; }
</style>
</head>
<body>
  <h1>postq 로 쿠키 보내기</h1>
  <p class="sub">이 브라우저에 로그인된 도메인의 쿠키를 그대로 postq 에 저장합니다.</p>

  <label for="domain">도메인</label>
  <input id="domain" placeholder="예: api.example.com" autofocus>

  <div class="row">
    <div>
      <label for="ws">워크스페이스</label>
      <input id="ws" placeholder="default" value="default">
    </div>
    <div>
      <label for="env">환경 (선택)</label>
      <input id="env" placeholder="비우면 공용">
    </div>
  </div>

  <label for="server">postq 주소</label>
  <input id="server" placeholder="http://localhost:3000" value="http://localhost:3000">

  <button id="go">가져오기</button>
  <div id="out"></div>
  <p class="hint">postq 앱이 3001 등 다른 포트에 떴다면 위 주소의 포트를 맞춰 주세요.</p>

  <script src="popup.js"></script>
</body>
</html>
